<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   THE RESEARCH PAGE

   This page renders the SAME .md files the AI fetches when it builds a
   program. It does not hold a copy of them. That is the entire point:
   the moment a reference file is edited, the prompt chain and this page
   change together, and there is no second version to forget about.

   Add a topic by adding one entry to TOPICS. The file must already be
   published at json.fit root, since that is where the prompt chain
   expects it.

   The markdown is fetched at an ABSOLUTE URL rather than a relative one
   so this file also renders correctly when opened straight off disk for
   review, before it is ever deployed.
   ════════════════════════════════════════════════════════════════════ */

var TOPICS = [
  {
    key: 'rest',
    label: 'Rest periods',
    file: 'https://json.fit/rest-references.md',
    title: 'How long to <em>rest.</em>',
    blurb: 'Rest is a secondary lever behind volume, load and how close you train to failure. These are the studies that set every number the timer counts down.'
  },
  {
    key: 'reps',
    label: 'Rep ranges',
    file: 'https://json.fit/rep-range-references.md',
    title: 'How many <em>reps.</em>',
    blurb: 'Muscle grows across roughly 5 to 30 reps when effort and weekly sets are matched. What changes with the number is which exercises can carry it.'
  },
  {
    key: 'volume',
    label: 'Training volume',
    file: 'https://json.fit/volume-references.md',
    title: 'How many <em>sets.</em>',
    blurb: 'Weekly sets per muscle is the dial that drives growth. Every muscle gets its own range, and these are the meta-analyses behind them.'
  }
];

(function(){
  var params = new URLSearchParams(location.search);
  var key = params.get('topic') || 'rest';
  var topic = TOPICS.filter(function(t){ return t.key === key; })[0] || TOPICS[0];

  document.getElementById('docTitle').innerHTML = topic.title;
  document.getElementById('docBlurb').textContent = topic.blurb;
  document.title = topic.label + ' — the research behind JSON.fit';

  document.getElementById('topics').innerHTML = TOPICS.map(function(t){
    return '<a class="topic' + (t.key === topic.key ? ' active' : '') +
           '" href="?topic=' + t.key + '">' + t.label + '</a>';
  }).join('');

  document.getElementById('docMeta').innerHTML =
    '<span>Source &middot; <a href="' + topic.file + '">' + topic.file.replace('https://json.fit/','') + '</a></span>' +
    '<span>Read by the app when it writes your program</span>';

  var body = document.getElementById('docBody');

  // A CDN failure must not leave a blank page. Every failure path ends with a
  // working link to the raw file, which is the thing the visitor came for.
  function fallback(msg){
    body.innerHTML = '<div class="state">' + msg +
      '<br><br><a href="' + topic.file + '">Open the raw file &rarr;</a></div>';
  }

  if (typeof marked === 'undefined') { fallback('Could not load the renderer'); return; }

  fetch(topic.file, { cache: 'no-cache' })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(md){
      body.innerHTML = marked.parse(md);
      // Every citation here points off-site to PubMed and friends. Open them in
      // a new tab so a visitor reading the list does not lose their place, and
      // set rel to stop the target page reaching back into this one.
      body.querySelectorAll('a[href^="http"]').forEach(function(a){
        if (a.hostname !== location.hostname) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
      });
    })
    .catch(function(){ fallback('Could not load the document'); });

  /* ── Mobile menu ── */
  var burger = document.getElementById('burger'), navLinks = document.getElementById('navLinks');
  burger.addEventListener('click', function(e){ e.stopPropagation(); burger.classList.toggle('open'); navLinks.classList.toggle('open'); });
  navLinks.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(){ burger.classList.remove('open'); navLinks.classList.remove('open'); }); });
})();
</script>

<script>
(function(){
  document.addEventListener('click',function(e){
    var a=e.target;
    while(a&&a.tagName!=='A')a=a.parentElement;
    if(!a||!a.href)return;
    try{
      var h=new URL(a.href).hostname;
      if(!h||h===location.hostname)return;
      var label;
      if(h==='apps.apple.com')label='app_store';
      else if(h==='www.youtube.com'||h==='youtu.be')label='youtube';
      else{var p=h.replace(/^www\./,'').split('.');var s=p[p.length-2]||p[0];label=s==='nih'?'pubmed':s;}
      if(window.track)window.track('outbound_click',{url:label});
    }catch(err){}
  },true);
})();
</script>
