  // ── Helpers ──
  function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function titleCase(s){ return String(s||'').replace(/(^|[\s_-])(\w)/g,function(_,sep,ch){return sep.replace(/[_-]/,' ')+ch.toUpperCase();}); }
  function clampPortions(n){ n=parseInt(n,10); if(isNaN(n)||n<1) return 1; return Math.min(n,CONFIG.MAX_PORTIONS); }

  function slugifyImage(f){
    if(!f) return '';
    var ext=(f.match(/\.(png|jpe?g|webp)$/i)||['','png'])[1].toLowerCase();
    var base=f.replace(/\.(png|jpe?g|webp)$/i,'');
    var slug=base.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s-]/g,'').trim().replace(/[\s_]+/g,'-').replace(/-+/g,'-').toLowerCase();
    return slug+'.'+ext;
  }

  function formatTime(min){
    min=parseInt(min,10);
    if(!min||min<=0) return '';
    if(min<60) return min+'m';
    var h=Math.floor(min/60), r=min%60;
    return r===0 ? h+'h' : h+'h '+r+'m';
  }

  function getMealSlug(){
    var m=window.location.search.match(/[?&]meal=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function getPlateId(){
    var m=window.location.search.match(/[?&]plate=([^&]+)/);

  }

    var target=(plate && entry.plates.indexOf(plate)>-1) ? plate : entry.canonical;
    if(!target) return false;
    window.location.replace('/r/'+encodeURIComponent(slug)+'/'+encodeURIComponent(target)+'/');
    return true;
  }

  // Image URL for a given plate (falls back to meal-level image), mirrors meals.html logic
  function imageUrl(plate){
    var hosted=(plate&&plate.photo_url)||meal.photo_url;
    if(hosted) return hosted;
    var file=(plate&&plate.image_filename)||meal.image_filename;
    return file ? CONFIG.IMAGE_BASE+slugifyImage(file) : '';
  }

  function webpUrl(plate){
    var hosted=(plate&&plate.photo_url)||meal.photo_url;
    if(hosted) return '';
    var file=(plate&&plate.image_filename)||meal.image_filename;
    if(!file) return '';
    return CONFIG.IMAGE_BASE+slugifyImage(file).replace(/\.(png|jpe?g)$/i,'.webp');
  }

  // Ingredient display name — prefer explicit names, fall back to title-cased id
  function ingName(ing){
    // Just what the ingredient is: the part before any comma or bracket.
    var n=String(ing.display_name || ing.name || titleCase(ing.ingredient_id || ing.id || 'Ingredient'));
    var short=n.split(/[,(]/)[0].trim();
    return short || n;
  }
  // Plain-text fractions for counts and spoon units — "1 1/2", not the tiny
  // unicode "\u00bd" glyphs, which are unreadable at ingredient-row size.
  // Never renders a nonzero amount as 0 — 2 eggs across 5 servings shows 1/3, not 0.
  function niceFraction(n){
    var whole=Math.floor(n), frac=n-whole;
    var table=[[0,''],[0.25,'1/4'],[1/3,'1/3'],[0.5,'1/2'],[2/3,'2/3'],[0.75,'3/4'],[1,'']];
    var best=table[0], bd=99;
    for(var i=0;i<table.length;i++){var d=Math.abs(frac-table[i][0]); if(d<bd){bd=d;best=table[i];}}
    if(best[0]===1){whole+=1; best=[0,''];}
    if(whole===0&&!best[1]) return n>0?String(Math.round(n*100)/100):'0';
    if(!best[1]) return String(whole);
    return whole>0 ? whole+' '+best[1] : best[1];
  }
  function formatAmount(amt, unit){
    if(amt==null) return '';
    var u=String(unit||'').toLowerCase();
    if(u===''||u==='unit'||u==='count') return niceFraction(amt);
    if(u==='tsp'||u==='tbsp') return niceFraction(amt)+' '+u;
    if(u==='cloves'||u==='clove'){ var c=niceFraction(amt); return c+(amt===1?' clove':' cloves'); }
    if(u!=='g'&&u!=='ml'&&u!=='kg'&&u!=='l') return niceFraction(amt)+' '+unit;
    var rounded=Math.round(amt*10)/10;
    return rounded+unit;
  }

  // A step may be a string, {summary,...}, or {text,...}
  function stepText(step){
    if(typeof step==='string') return step;
    return (step && (step.summary||step.text)) || '';
  }
  function stepHTML(step){
    var t=esc(stepText(step));
    return (step && step.title) ? '<b>'+esc(step.title)+'.</b> '+t : t;
  }
  function isBatch(){ return !!(meal && meal.batch); }
  function storageText(){
    var st=(meal.meal_prep||{}).storage; if(!st) return '';
    var bits=[];
    if(st.fridge_days) bits.push('fridge '+st.fridge_days+' day'+(st.fridge_days===1?'':'s'));
    if(st.freeze_months) bits.push('freezer '+st.freeze_months+' month'+(st.freeze_months===1?'':'s'));
    return bits.join(' \u00b7 ');
  }

  function methodDescriptor(m){
    var id=String(m.id||'').toLowerCase();
    var sc=m.shortcut_level;
    if(id.indexOf('slow_cooker')>-1) return 'Hands-off · set & forget';
    if(id.indexOf('pressure')>-1||id.indexOf('instant_pot')>-1) return 'Fast pressure cook';
    if(id.indexOf('oven')>-1) return 'Hands-off · oven roasted';
    if(sc==='authentic'||sc==='scratch'||sc==='from_scratch') return 'Best flavour · more effort';
    if(sc==='shortcut'||sc==='jar') return 'Quickest · weeknight';
    if(sc==='balanced') return 'Balanced · everyday';
    return '';
  }

  function canonicalPlate(){
    var p=meal.plates||[];
    var byName=p.filter(function(x){return x.display_name===meal.display_name;})[0];
    if(byName) return byName;
    var nonStunt=p.filter(function(x){return !x.is_stunt_plate;})[0];
    return nonStunt||p[0]||{};
  }

  // ── Fetch ──
  function fetchMeals(){
    return new Promise(function(resolve,reject){
      var ctrl=new AbortController();
      var t=setTimeout(function(){ctrl.abort();},8000);
      fetch(CONFIG.MEALS_JSON,{signal:ctrl.signal}).then(function(res){
        clearTimeout(t);
        if(!res.ok) throw new Error('http_'+res.status);
        return res.json();
      }).then(function(d){
        if(d && Object.keys(d).length) resolve(d);
        else reject(new Error('empty'));
      }).catch(function(e){ clearTimeout(t); reject(e); });
    });
  }

  // ── State helpers ──
  function currentPlate(){ return (meal.plates&&meal.plates[plateIdx])||{}; }
  function currentMethod(){ return (meal.methods&&meal.methods[methodIdx])||null; }
  // ── Sauce-variant helpers (MAKE IT — mirrors the app) ──
  function mealVariants(){ return (meal&&meal.variants&&meal.variants.length>1)?meal.variants:null; }
  function currentVariant(){ var v=mealVariants(); return v?v[variantIdx]:null; }
  function variantMethodData(method){ var v=currentVariant(); return (v&&method&&v.methods&&v.methods[method.id])||null; }
  function variantExtraTotal(){ var v=currentVariant(); return (v&&!v.is_default)?(v.extra_total_minutes||0):0; }
  function variantDescriptor(v){ var l=String(v.shortcut_level||''); if(l==='scratch'||l==='authentic'||l==='from_scratch') return 'Best flavour · more effort'; if(l==='shortcut'||l==='jar') return 'Quickest · weeknight'; return 'Everyday'; }
  function activeMacros(plate){ var v=currentVariant(); if(v&&!v.is_default&&v.plate_macros&&v.plate_macros[plate.id]) return v.plate_macros[plate.id]; return plate.plate_macros||{}; }

  // ── Render: dynamic sections that depend on selected plate/method/servings ──
  function renderDynamic(){

        : '<div class="hero-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4M6 11v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"/></svg></div>';
      var photo=document.getElementById('hero-photo');

  function cell(val, label, hl){
    var v = (val==null) ? '\u2013' : (label==='kcal' ? Math.round(val) : Math.round(val)+'g');

  }

  function renderIngredients(plate, method){
    var sec=document.getElementById('ing-section');
    var vd=variantMethodData(method);
    var baseIngs=(vd&&vd.ingredients)||(method&&method.ingredients)||meal.ingredients||[];
    var plateIngs=plate.additional_ingredients||[];
    if(!baseIngs.length && !plateIngs.length){ sec.style.display='none'; return; }
    sec.style.display='';

    var baseServings = meal.produces_servings || 1;
    var html='';
    if(isBatch()){
      // Whole-pot amounts, exactly as the app lists them, with the shop pack under each.
      var b=meal.batch;
      var brow=function(ing, each){
        var amt=formatAmount(ing.base_amount, ing.unit)+(each?' per tub':'');
        var pack=(ing.pack&&ing.pack!=='pantry')?ing.pack:'';
        return '<div class="ing-row"><span class="ing-name">'+esc(ingName(ing))+(ing.pack==='pantry'?'<span class="pantry">pantry</span>':'')+'</span><span class="ing-amt">'+esc(amt)+'</span></div>';
      };
      html+=baseIngs.map(function(i){return brow(i,false);}).join('');
      if(plateIngs.length){
        html+='<div class="sub-eyebrow" style="margin-top:1.25rem">On the day, per tub</div>';
        html+=plateIngs.map(function(i){return brow(i,true);}).join('');
      }
      document.getElementById('ing-list').innerHTML=html;
      document.getElementById('servings-ctrl').style.display='none';
      return;
    }
    function rows(list, perServing){
      return list.map(function(ing){
        var raw=(ing.base_amount!=null)?ing.base_amount:null;
        var amtStr;
        if(raw!=null){
          var u=String(ing.unit||'').toLowerCase();
          if(ing.scaling==='fixed' && (u===''||u==='unit'||u==='count') && perServing>1){
            // Batch-fixed aromatics (bay leaves etc.): whole-batch amount, never divided.
            amtStr=formatAmount(raw, ing.unit)+' (for the batch)';
          } else {
            var scaled = raw * servings / Math.max(1, perServing);
            amtStr=formatAmount(scaled, ing.unit);
          }
        } else {
          amtStr = ing.amount!=null ? formatAmount(ing.amount*servings, ing.unit) : '';
        }
        return '<div class="ing-row"><span class="ing-name">'+esc(ingName(ing))+'</span>'+(amtStr?'<span class="ing-amt">'+esc(amtStr)+'</span>':'')+'</div>';
      }).join('');
    }
    if(baseIngs.length){
      if(plateIngs.length) html+='<div class="sub-eyebrow">For the base</div>';
      html+=rows(baseIngs, baseServings);
    }
    if(plateIngs.length){
      html+='<div class="sub-eyebrow" style="margin-top:1.25rem">To plate it up</div>';
      html+=rows(plateIngs, 1);
    }
    document.getElementById('ing-list').innerHTML=html;

    // Show/hide servings stepper depending on whether amounts are scalable
    var scalable = baseIngs.concat(plateIngs).some(function(i){return i.base_amount!=null||i.amount!=null;});
    document.getElementById('servings-ctrl').style.display = scalable ? '' : 'none';
    document.getElementById('servings-val').textContent = servings;
  }

  function renderSteps(plate, method){
    var sec=document.getElementById('step-section');
    var vds=variantMethodData(method);
    var baseSteps=(vds&&vds.instructions)||(method&&method.instructions)||meal.instructions||[];
    var plateSteps=plate.additional_instructions||[];
    if(!baseSteps.length && !plateSteps.length){ sec.style.display='none'; return; }
    sec.style.display='';

    var total=baseSteps.length+plateSteps.length;
    var t = method ? ((method.time_total_minutes||0)+variantExtraTotal()) : 0;
    t += (plate.assembly_time_minutes||0);
    var metaTxt = total+' step'+(total===1?'':'s')+(formatTime(t)?' · ~'+formatTime(t):'');

        s+='<div class="step-row"><div class="step-num">'+n+'</div><div class="step-text">'+stepHTML(st)+'</div></div>';
      });
      return s;
    }
    html+=block(baseSteps,isBatch()?'Cook day':'Cook the base');
    html+=block(plateSteps,isBatch()?'On the day':'Plate it up');
    document.getElementById('step-list').innerHTML=html;
  }

        '</ul>'+
        '<div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;">'+
        '<a href="'+CONFIG.APP_STORE_URL+'?pt=127775601&amp;ct=website_recipe_teaser&amp;mt=8" class="store-link" data-loc="recipe_teaser" onclick="gtag(\'event\',\'download_click\',{\'button_location\':\'recipe_teaser\',\'platform\':\'ios\'})"><img src="/images/App_Store.svg" alt="Download on the App Store" onerror="this.outerHTML=\'<span class=&quot;cta-btn&quot; style=&quot;display:inline-flex&quot;>Download on the App Store</span>\'"></a>'+
        '<a href="'+CONFIG.PLAY_STORE_URL+'&amp;referrer='+encodeURIComponent('utm_source=json.fit&utm_medium=web&utm_content=recipe_teaser')+'" class="store-link" data-loc="recipe_teaser" onclick="gtag(\'event\',\'download_click\',{\'button_location\':\'recipe_teaser\',\'platform\':\'android\'})"><img src="/en_badge_web_generic.png" alt="Get it on Google Play" style="height:68px;margin:-11px 0;" onerror="this.outerHTML=\'<span class=&quot;cta-btn&quot; style=&quot;display:inline-flex&quot;>Get it on Google Play</span>\'"></a>'+
      '</div>'+
        '<div class="teaser-foot">Free \u00b7 No ads \u00b7 No account</div>'+
      '</div>'+
    '</div>';

    document.getElementById('content-inner').innerHTML = html +
      // sticky CTA bar appended outside .wrap so it spans full width
      '';

    // Sticky CTA bar (added to body once)
    if(!document.getElementById('cta-bar')){
      var bar=document.createElement('div');
      bar.className='cta-bar'; bar.id='cta-bar';
      bar.innerHTML='<div class="cta-bar-inner"><div class="cta-bar-text"><strong id="cta-bar-title">Make this in Coast</strong><span id="cta-bar-sub"></span></div><a class="cta-btn" href="/#download" onclick="gtag(\'event\',\'view_download_options\',{\'button_location\':\'recipe_sticky\'})">Get the app free</a></div>';
      document.body.appendChild(bar);
    }

    wireInteractions();
  }

  function wireInteractions(){
    // Plate pills
    var pills=document.querySelectorAll('#plate-pills .pill');
    pills.forEach(function(p){
      p.addEventListener('click',function(){
        plateIdx=parseInt(p.getAttribute('data-plate'),10);
        pills.forEach(function(x){x.classList.remove('active');});
        p.classList.add('active');
        renderDynamic();
        if(typeof gtag==='function') gtag('event','recipe_plate_switch',{plate:plateIdx});
      });
    });

    // Method rows
    var rows=document.querySelectorAll('#method-list .method-row');
    rows.forEach(function(r){
      r.addEventListener('click',function(){
        methodIdx=parseInt(r.getAttribute('data-method'),10);
        rows.forEach(function(x){x.classList.remove('active');});
        r.classList.add('active');
        renderDynamic();
      });
    });

    // Variant rows (MAKE IT)
    var vrows=document.querySelectorAll('#variant-list .method-row');
    vrows.forEach(function(r){
      r.addEventListener('click',function(){
        variantIdx=parseInt(r.getAttribute('data-variant'),10);
        vrows.forEach(function(x){x.classList.remove('active');});
        r.classList.add('active');
        renderDynamic();
        if(typeof gtag==='function') gtag('event','recipe_variant_switch',{variant:variantIdx});
      });
    });

    // Servings stepper
    var minus=document.getElementById('serv-minus'), plus=document.getElementById('serv-plus');
    if(minus) minus.addEventListener('click',function(){ servings=clampPortions(servings-1); renderDynamic(); });
    if(plus) plus.addEventListener('click',function(){ servings=clampPortions(servings+1); renderDynamic(); });

    // Steps accordion (button — toggles aria-expanded for screen readers)
    var stepHeader=document.getElementById('step-header');
    if(stepHeader) stepHeader.addEventListener('click',function(){
      var sec=document.getElementById('step-section');
      sec.classList.toggle('acc-open');
      stepHeader.setAttribute('aria-expanded', sec.classList.contains('acc-open') ? 'true' : 'false');
    });
  }

  // ── Recipe schema for SEO / AI crawlers ──
  function updateSchema(plate, method){
    var old=document.getElementById('recipe-schema'); if(old) old.remove();
    var m=activeMacros(plate)||{};
    var img=imageUrl(plate);
    var ingredients=[];
    var baseI=(method&&method.ingredients)||meal.ingredients||[];
    var plateI=plate.additional_ingredients||[];
    baseI.concat(plateI).forEach(function(i){ ingredients.push(ingName(i)); });
    var steps=[];
    var baseS=(method&&method.instructions)||meal.instructions||[];
    (baseS).concat(plate.additional_instructions||[]).forEach(function(s){ var t=stepText(s); if(t) steps.push({"@type":"HowToStep","text":t}); });

    var data={
      "@context":"https://schema.org","@type":"Recipe",
      "name":plate.display_name||meal.display_name,
      "url":window.location.href,
      "recipeCuisine":titleCase(meal.cuisine||''),
      "author":{"@type":"Organization","name":"Coast"}
    };
    if(img) data.image=[img];
    if(plate.description) data.description=plate.description;
    if(method && method.time_total_minutes) data.totalTime='PT'+method.time_total_minutes+'M';
    if(ingredients.length) data.recipeIngredient=ingredients;
    if(steps.length) data.recipeInstructions=steps;
    var nut={"@type":"NutritionInformation"};
    if(m.kcal!=null) nut.calories=Math.round(m.kcal)+' kcal';
    if(m.protein_g!=null) nut.proteinContent=Math.round(m.protein_g)+' g';
    if(m.carbs_g!=null) nut.carbohydrateContent=Math.round(m.carbs_g)+' g';
    if(m.fat_g!=null) nut.fatContent=Math.round(m.fat_g)+' g';
    if(Object.keys(nut).length>1) data.nutrition=nut;

    var s=document.createElement('script');
    s.type='application/ld+json'; s.id='recipe-schema';
    s.textContent=JSON.stringify(data);
    document.head.appendChild(s);

    // og/meta — only on the query-string page. A generated page already has a
    // better, static head; overwriting it here would just undo the build.
    if(!window.__RECIPE__){
      setMeta('description', (plate.description || (titleCase(meal.cuisine||'meal')+': '+Math.round(m.protein_g||0)+'g protein, '+Math.round(m.kcal||0)+' kcal. Free in Coast.')));
      setMeta('og:title', (plate.display_name||meal.display_name)+' | Coast', true);
      if(img) setMeta('og:image', img, true);
    }

    // Canonical — always the static per-plate page, so ?meal=&plate= URLs and
    // /r/<slug>/<plate>/ consolidate onto one address. The generated pages ship
    // this in static HTML already; setting it again here is a no-op for them.
    if(!window.__RECIPE__){
      var slug=getMealSlug(), pid=(plate&&plate.id)||'';
      var canon=document.querySelector('link[rel="canonical"]');
      if(!canon){ canon=document.createElement('link'); canon.setAttribute('rel','canonical'); document.head.appendChild(canon); }
      canon.setAttribute('href', slug&&pid
        ? 'https://getcoast.fit/r/'+encodeURIComponent(slug)+'/'+encodeURIComponent(pid)+'/'
        : 'https://getcoast.fit/r/?meal='+encodeURIComponent(slug||''));
    }
  }
  function setMeta(name, val, isProp){
    var sel = isProp ? 'meta[property="'+name+'"]' : 'meta[name="'+name+'"]';
    var el=document.querySelector(sel);
    if(!el){ el=document.createElement('meta'); el.setAttribute(isProp?'property':'name',name); document.head.appendChild(el); }
    el.setAttribute('content',val);
  }

  // ── Lightbox ──
  function openLb(src,alt){ var lb=document.getElementById('lightbox'); document.getElementById('lbImg').src=src; document.getElementById('lbImg').alt=alt||''; lb.classList.add('open'); document.body.style.overflow='hidden'; }
  document.getElementById('lightbox').addEventListener('click',function(){ this.classList.remove('open'); document.body.style.overflow=''; });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ document.getElementById('lightbox').classList.remove('open'); closeVideo(); document.body.style.overflow=''; } });

  // ── Per-meal video (data lives in /r/videos.json, keyed by slug) ──
  function fetchVideos(){
    return new Promise(function(resolve){
      var ctrl=new AbortController();
      var t=setTimeout(function(){ctrl.abort();},5000);
      fetch(CONFIG.VIDEOS_JSON,{signal:ctrl.signal})
        .then(function(r){ clearTimeout(t); return r.ok?r.json():{}; })
        .then(function(d){ resolve(d && typeof d==='object' ? d : {}); })
        .catch(function(){ clearTimeout(t); resolve({}); }); // video is non-critical: never block the recipe
    });
  }
  function ytId(url){
    if(!url) return null;
    url=String(url).trim();
    if(/^[\w-]{11}$/.test(url)) return url;
    try{
      var u=new URL(url);
      if(u.hostname.indexOf('youtu.be')>-1){ var seg=u.pathname.split('/').filter(Boolean)[0]; if(seg&&/^[\w-]{11}$/.test(seg)) return seg; }
      var mm=u.pathname.match(/\/(?:shorts|embed|v)\/([\w-]{11})/); if(mm) return mm[1];
      var v=u.searchParams.get('v'); if(v&&/^[\w-]{11}$/.test(v)) return v;
    }catch(e){}
    var any=url.match(/[\w-]{11}/); return any?any[0]:null;
  }
  function renderVideo(map){
    var slot=document.getElementById('video-slot'); if(!slot) return;
    var slug=getMealSlug();
    var url = map && (map[slug] || (meal && map[meal.slug]));
    var id = ytId(url);
    if(!id){ slot.style.display='none'; slot.innerHTML=''; return; }
    var poster='https://i.ytimg.com/vi/'+id+'/maxresdefault.jpg';
    slot.style.display='';
    slot.innerHTML =
      '<div class="vfacade" role="button" tabindex="0" aria-label="Watch how this meal is made">'+
        '<div class="vposter">'+
          '<img src="'+esc(poster)+'" alt="" loading="lazy" data-hq="https://i.ytimg.com/vi/'+esc(id)+'/hqdefault.jpg">'+
          '<div class="scrim"></div><div class="vplay"></div>'+
        '</div>'+
        '<div class="vmeta">'+
          '<div class="vk">\u25B6 Watch me make it</div>'+
          '<div class="vt">See how it\u2019s made</div>'+
          '<div class="vs">A quick clip of this exact meal. Tap to watch full-screen.</div>'+
          '<span class="vgo">tap to play \u2192</span>'+
        '</div>'+
      '</div>';
    var img=slot.querySelector('.vposter img');
    if(img) img.addEventListener('error',function(){ this.onerror=null; this.src=this.dataset.hq; }); // maxres → hq fallback
    var card=slot.querySelector('.vfacade');
    function go(){ openVideo(id); }
    card.addEventListener('click',go);
    card.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  }
  function openVideo(id){
    var m=document.getElementById('vmodal'); if(!m) return;
    m.querySelector('.vmodal-slot').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="Recipe video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    m.classList.add('open'); document.body.style.overflow='hidden';
    if(typeof gtag==='function') gtag('event','meal_video_play',{meal:getMealSlug()||'',video_id:id});
  }
  function closeVideo(){
    var m=document.getElementById('vmodal'); if(!m) return;
    m.classList.remove('open'); m.querySelector('.vmodal-slot').innerHTML=''; document.body.style.overflow='';
  }
  (function(){
    var vm=document.getElementById('vmodal'); if(!vm) return;
    vm.addEventListener('click',function(e){ if(e.target===vm) closeVideo(); });
    var cb=vm.querySelector('.vmodal-close'); if(cb) cb.addEventListener('click',closeVideo);
  })();

  // ── State switching ──
  function showState(id){ document.querySelectorAll('.state').forEach(function(el){el.classList.remove('active');}); document.getElementById(id).classList.add('active'); }
  function showError(title,msg){ if(title)document.getElementById('error-title').textContent=title; if(msg)document.getElementById('error-msg').textContent=msg; showState('state-error'); }

  // ── Init ──
  // Index of the plate to open with — an explicit id wins, else the canonical one.
  function initialPlateIdx(wantedId){
    var ps=meal.plates||[];
    if(wantedId){
      for(var i=0;i<ps.length;i++){ if(ps[i].id===wantedId) return i; }
    }
    var canon=canonicalPlate();
    var at=ps.indexOf(canon);
    return at>-1 ? at : 0;
  }

  function mount(data, slug, wantedPlateId){
    meal=data;
    plateIdx=initialPlateIdx(wantedPlateId); methodIdx=0;
    // Made-ahead recipes (brownies, egg muffins) open on the whole batch, as the app lists them.
    servings=Math.min(Math.max(1,meal.produces_servings||1),CONFIG.MAX_PORTIONS);
    renderShell();
    renderDynamic();
    showState('state-content');
    fetchVideos().then(renderVideo);
    if(typeof gtag==='function') gtag('event','recipe_view',{meal:slug,plate:(currentPlate().id||'')});
  }

  function init(){
    if(redirectToStatic()) return;

    // Generated page: the meal is already inlined, no fetch, no loading state.
    var pre=window.__RECIPE__;
    if(pre && pre.meal){ mount(pre.meal, pre.slug, pre.plateId); return; }

    var slug=getMealSlug();
    if(!slug){ showError('No recipe selected','Pick a meal from the library to see its recipe.'); return; }
    fetchMeals().then(function(data){
      if(!data[slug]){ showError(); return; }
      mount(data[slug], slug, getPlateId());
    }).catch(function(){
      showError("Couldn't load this recipe","Check your connection and try again, or browse the full library.");
    });
  }

  init();
})();
</script>

<script>
(function(){
  document.addEventListener('click',function(e){
    var a=e.target;
    while(a&&a.tagName!=='A')a=a.parentElement;
    if(!a||!a.href)return;
    try{
      var h=new URL(a.href).hostname;
      if(!h||h===location.hostname)return;
      // Store buttons with data-loc are counted as download_click (same event the rest of the site sends).
      if(a.dataset.loc&&(h==='apps.apple.com'||h==='play.google.com')){if(window.track)window.track('download_click',{button_location:a.dataset.loc,store:h==='play.google.com'?'play':'app_store'});return;}
      var label;
      if(h==='apps.apple.com')label='app_store';
      else if(h==='www.youtube.com'||h==='youtu.be')label='youtube';
      else{var p=h.replace(/^www\./,'').split('.');var s=p[p.length-2]||p[0];label=s==='nih'?'pubmed':s;}
      if(window.track)window.track('outbound_click',{url:label});
    }catch(err){}
  },true);
})();
</script>
